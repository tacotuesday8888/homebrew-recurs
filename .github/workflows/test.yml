name: Test formula

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Add checkout as a local tap
        run: brew tap tacotuesday8888/recurs "$GITHUB_WORKSPACE"

      - name: Check formula style
        run: brew style tacotuesday8888/recurs/recurs

      - name: Install formula
        run: brew install --build-from-source tacotuesday8888/recurs/recurs

      - name: Test installed CLI
        run: brew test tacotuesday8888/recurs/recurs
